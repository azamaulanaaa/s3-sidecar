name: Release Container Image

# Publish the multi-arch container image when the Release workflow announces a
# release. A human can also publish a release in the GitHub UI, which uses the
# `release: published` event, or dispatch the workflow by hand.
#
# The Release workflow calls this workflow through a cargo-dist custom job. A
# called workflow gets the caller's event. Thus the default path resolves the
# tag from `github.ref_name`.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example 0.2.0
        required: true
        type: string
      prerelease:
        description: Set to true for a prerelease. A prerelease does not update the latest tag.
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      plan:
        description: The cargo-dist plan from the Release workflow.
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BINARY_NAME: s3-sidecar

permissions:
  contents: read

# Use one run for each tag. Never cancel a run that started. A second run for
# the same tag must not remove images that the first run pushed.
concurrency:
  group: release-container-image-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release information
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Resolve the tag and prerelease flag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            prerelease="${INPUT_PRERELEASE:-false}"
            publish=true
          elif [ "$EVENT_NAME" = "release" ]; then
            tag="$RELEASE_TAG"
            prerelease="${RELEASE_PRERELEASE:-false}"
            publish=true
          else
            tag="$GITHUB_REF_NAME"
            prerelease=false
            publish=false
            if prerelease=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease' 2>/dev/null); then
              publish=true
            else
              prerelease=false
              echo "::notice::The release $tag does not exist or is not accessible. The image build is skipped."
            fi
          fi
          if [ -z "$tag" ]; then
            echo "::error::The tag is empty. Set the tag input or run the workflow from a tag."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build-arch-images:
    name: Build the ${{ matrix.arch }} image
    needs: resolve
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p download
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*${TARGET}.tar.xz" --dir download; then
            echo "::error::Cannot download the release archive for $TARGET from release $TAG. Check that the release exists and that it has the archive."
            exit 1
          fi
          archive=$(find download -maxdepth 1 -name "*${TARGET}.tar.xz" -type f -print -quit)
          if [ -z "$archive" ]; then
            echo "::error::The download directory has no archive for $TARGET. Check the asset pattern in this workflow."
            exit 1
          fi
          echo "Downloaded $archive."

      - name: Extract the binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive=$(find download -maxdepth 1 -name "*${TARGET}.tar.xz" -type f -print -quit)
          if [ -z "$archive" ]; then
            echo "::error::The download directory has no archive for $TARGET."
            exit 1
          fi
          tar -xvf "$archive" -C download
          binary=$(find download -name "$BINARY_NAME" -type f -print -quit)
          if [ -z "$binary" ]; then
            echo "::error::The release archive for $TARGET has no binary named $BINARY_NAME."
            exit 1
          fi
          mv "$binary" "./$BINARY_NAME"
          chmod +x "./$BINARY_NAME"
          echo "Moved $BINARY_NAME to the project root."

      - name: Build and push the architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            BINARY_NAME=${{ env.BINARY_NAME }}

  create-manifest:
    name: Create the multi-arch manifest
    needs:
      - resolve
      - build-arch-images
    if: ${{ needs.resolve.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the version manifest
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create -t "${base}:${TAG}" \
            "${base}:${TAG}-amd64" \
            "${base}:${TAG}-arm64"
          echo "Pushed ${base}:${TAG}."

      - name: Update the latest tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${PRERELEASE:-false}" = "true" ]; then
            echo "Release $TAG is a prerelease. The latest tag is unchanged."
            exit 0
          fi
          base="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create -t "${base}:latest" \
            "${base}:${TAG}-amd64" \
            "${base}:${TAG}-arm64"
          echo "Pushed ${base}:latest."
