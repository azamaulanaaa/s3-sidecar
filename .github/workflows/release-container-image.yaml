name: Release Container Image

# Publish the multi-arch container image when a GitHub release is published.
#
# Use the `release: published` event. The release event gives the tag directly.
# Do not use a `workflow_run` trigger on release.yml. That trigger can also
# start from a pull request run.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example 0.1.0
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BINARY_NAME: s3-sidecar
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

# Use one run for each tag. Never cancel a run that started. A second run for
# the same tag must not remove images that the first run pushed.
concurrency:
  group: release-container-image-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build-arch-images:
    name: Build the ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p download
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*${TARGET}.tar.xz" --dir download; then
            echo "::error::Cannot download the release archive for $TARGET from release $TAG. Check that the release exists and that it has the archive."
            exit 1
          fi
          archive=$(find download -maxdepth 1 -name "*${TARGET}.tar.xz" -type f -print -quit)
          if [ -z "$archive" ]; then
            echo "::error::The download directory has no archive for $TARGET. Check the asset pattern in this workflow."
            exit 1
          fi
          echo "Downloaded $archive."

      - name: Extract the binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive=$(find download -maxdepth 1 -name "*${TARGET}.tar.xz" -type f -print -quit)
          if [ -z "$archive" ]; then
            echo "::error::The download directory has no archive for $TARGET."
            exit 1
          fi
          tar -xvf "$archive" -C download
          binary=$(find download -name "$BINARY_NAME" -type f -print -quit)
          if [ -z "$binary" ]; then
            echo "::error::The release archive for $TARGET has no binary named $BINARY_NAME."
            exit 1
          fi
          mv "$binary" "./$BINARY_NAME"
          chmod +x "./$BINARY_NAME"
          echo "Moved $BINARY_NAME to the project root."

      - name: Build and push the architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ matrix.arch }}
          build-args: |
            BINARY_NAME=${{ env.BINARY_NAME }}

  create-manifest:
    name: Create the multi-arch manifest
    needs: build-arch-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the version manifest
        env:
          TAG: ${{ needs.build-arch-images.outputs.tag }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create -t "${base}:${TAG}" \
            "${base}:${TAG}-amd64" \
            "${base}:${TAG}-arm64"
          echo "Pushed ${base}:${TAG}."

      - name: Update the latest tag
        env:
          TAG: ${{ needs.build-arch-images.outputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "${PRERELEASE:-false}" = "true" ]; then
            echo "Release $TAG is a prerelease. The latest tag is unchanged."
            exit 0
          fi
          base="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create -t "${base}:latest" \
            "${base}:${TAG}-amd64" \
            "${base}:${TAG}-arm64"
          echo "Pushed ${base}:latest."
