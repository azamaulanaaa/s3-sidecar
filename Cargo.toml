[package]
name = "s3-sidecar"
version = "0.1.0"
edition = "2024"
description = "A small sidecar binary for S3 operations."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaa/s3-sidecar"
keywords = ["s3", "storage", "sidecar"]
categories = ["command-line-utilities"]

[dependencies]

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_arguments = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
