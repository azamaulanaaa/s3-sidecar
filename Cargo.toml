[package]
name = "s3-sidecar"
version = "0.3.0-rc.2"
edition = "2024"
description = "A small sidecar binary for S3 operations."
license = "MIT OR Apache-2.0"
repository = "https://github.com/azamaulanaa/s3-sidecar"
keywords = ["s3", "storage", "sidecar"]
categories = ["command-line-utilities"]

[dependencies]
async-stream = "0.3"
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls-ring"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
opentelemetry = { version = "0.33.1", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
  "grpc-tonic",
  "http-proto",
  "internal-logs",
  "logs",
  "metrics",
  "reqwest-blocking-client",
  "trace",
] }
opentelemetry-semantic-conventions = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["logs", "metrics", "rt-tokio", "trace"] }
openraft = { version = "0.10.0", default-features = false, features = ["serde", "tokio-rt"] }
percent-encoding = "2"
redb = "4.5.0"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls-webpki-roots",
  "stream",
  "http2",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tonic = { version = "0.14", default-features = false }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
tempfile = "3"

[lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
too_many_arguments = "deny"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
