# Example configuration for s3-sidecar.
#
# Cache mode forwards reads to the cache S3 endpoint and can accept writes
# before origin receives them. Cluster mode serves the object API from one or
# more nodes. Use consensus.backend = "single", "raft", or "consul".

mode = "cache"                 # cache | cluster

[server]
bind = "127.0.0.1:9000"
max_body_bytes = 5368709120     # 5 GiB. Larger bodies return 413 EntityTooLarge.
request_timeout = "5m"          # Non-streaming control requests.
idle_timeout = "60s"            # Maximum gap between stream chunks.
max_connections = 1024          # Excess requests return 503 SlowDown.
shutdown_timeout = "30s"        # Bound for draining in-flight requests.

# Optional TLS listener. Plain HTTP is used when this section is absent.
# [server.tls]
# cert_file = "/etc/s3-sidecar/tls/cert.pem"
# key_file = "/etc/s3-sidecar/tls/key.pem"

[upstream]
connect_timeout = "10s"
request_timeout = "5m"          # Time to receive upstream response headers.
retry_attempts = 2              # Retries after the first attempt.

[multipart]
# Settings for sidecar-owned object writes to origin, cache, backing, and peers.
# Client-driven multipart requests pass through unchanged.
enabled = true
threshold = "64MiB"      # Objects below this size use one PUT.
chunk_size = "16MiB"     # Target size of one part.
min_chunk_size = "5MiB"  # S3 minimum for every part except the last.
max_parts = 10000        # S3 maximum parts for one upload.
concurrency = 4          # Parallel part uploads.

[origin]
endpoint = "http://127.0.0.1:9001"
region = "us-east-1"
access_key_id = "minioadmin"
# Prefer S3_SIDECAR_ORIGIN__SECRET_ACCESS_KEY_FILE or
# --origin-secret-access-key-file in production.
secret_access_key = "minioadmin"
# force_path_style = true

[cache]
endpoint = "http://127.0.0.1:9002"
region = "us-east-1"
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
# force_path_style = true
bucket = "s3-sidecar-cache"
prefix = "cache"
mode = "read_write"            # read | write | read_write
max_bytes = 0                  # Required in cache mode. 0 is unlimited.
max_object_bytes = 1073741824
write_policy = "write_back"    # write_back | write_through
on_cache_error = "origin"      # origin | fail
high_watermark = 0.9
low_watermark = 0.8
# staging_ttl = "1h"           # Age at which a blob with no metadata is an orphan.
# orphan_ttl = "24h"           # Age at which a failed journal entry is removed.
# sync_workers = 4
# sync_max_attempts = 5
# sync_retry_base_ms = 200
# sync_debounce_ms = 100
# gc_interval = "60s"
# index_path = "s3-sidecar-cache-index.redb"
# serve_quarantined = false

[backing]
# Cluster mode only.
# bucket = "s3-sidecar-data"
# endpoint = "http://127.0.0.1:9001"
# region = "us-east-1"
# access_key_id = "..."
# secret_access_key = "..."

[consensus]
# Cluster mode only.
backend = "single"             # single | raft | consul

[consensus.raft]
# node_id = "a"
# The single backend uses peers. The raft backend uses nodes.
# peers = ["a"]
# The raft backend requires a shared secret and one bootstrap node.
# bootstrap = false
# Prefer S3_SIDECAR_CONSENSUS__RAFT__SECRET_FILE or
# --consensus-raft-secret-file in production.
# secret = "replace-me"
# rpc_timeout = "5s"
# [[consensus.raft.nodes]]
# id = "a"
# addr = "http://127.0.0.1:9000"
# [[consensus.raft.nodes]]
# id = "b"
# addr = "http://127.0.0.1:9100"

[consensus.consul]
# The consul backend uses Consul KV as the metadata authority.
# node_id = "a"
# address = "http://127.0.0.1:8500"
# advertise_addr = "http://127.0.0.1:9000"
# Prefer S3_SIDECAR_CONSENSUS__CONSUL__TOKEN_FILE or
# --consensus-consul-token-file in production.
# token = ""
# session_ttl = "15s"          # The Consul minimum is 10s.
# Prefer S3_SIDECAR_CONSENSUS__CONSUL__SECRET_FILE or
# --consensus-consul-secret-file in production.
# secret = "replace-me"

[cluster]
# Cluster mode only.
# staging_ttl = "1h"           # Age at which an uncommitted blob is an orphan.
# orphan_ttl = "24h"           # Age at which a tombstone and its blob are removed.
# gc_interval = "60s"
# metadata_path = "./s3-sidecar-meta.redb"
# The blob transport token. Required when a bucket replicas value is greater
# than 1. Prefer S3_SIDECAR_CLUSTER__SECRET_FILE or --cluster-secret-file.
# secret = "replace-me"
# read_repair = true           # Store a peer blob locally while serving it.
# replicate_workers = 4        # Concurrent replication workers.
# replicate_timeout = "10s"    # Abort one synchronous peer copy after this time.
# reconcile_interval = "5m"    # Replica reconciliation interval.
# [[cluster.nodes]]            # The full node directory. Required for replication.
# id = "a"
# addr = "http://127.0.0.1:9000"
# [[cluster.nodes]]
# id = "b"
# addr = "http://127.0.0.1:9100"
# [[cluster.nodes]]
# id = "c"
# addr = "http://127.0.0.1:9200"

[otel]
# OpenTelemetry export over OTLP. The default is off.
enabled = false
# metrics = true               # Metrics are on when OpenTelemetry is enabled.
# traces = false               # Server and upstream spans.
# logs = false                 # tracing events with trace correlation.
# trace_sample_ratio = 1.0     # 0.0 disables root traces. 1.0 samples every root.
# record_object_keys = false   # Add s3.object.key and keep object keys in spans and logs.
#                              # Off redacts span paths and log key fields.
# service_name = "s3-sidecar"
# service_version = "0.2.0"
# endpoint = "http://127.0.0.1:4317"
# trace_endpoint = "http://127.0.0.1:4317"
# logs_endpoint = "http://127.0.0.1:4317"
# protocol = "grpc"             # grpc | http/protobuf
# timeout = "10s"               # Timeout for one export request.
# export_interval = "60s"       # Interval between metric exports.
# trace_schedule_delay = "5s"   # Delay between trace exports.
# log_schedule_delay = "5s"     # Delay between log exports.
# export_timeout = "10s"        # Bound for the final flush at shutdown.
# headers = { "x-api-key" = "..." }
# Prefer --otel-headers-file or S3_SIDECAR_OTEL__HEADERS_FILE for a header
# secret. The file contains a JSON object.
# headers_file = "/run/secrets/otel-headers.json"
# resource_attributes = { "deployment.environment.name" = "production" }

[[clients]]
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
buckets = ["media"]

[[buckets]]
name = "media"
ttl = "1h"
# cache_mode = "read_write"
# cache_write_policy = "write_back"
# write_ack = "leader"         # leader | quorum | all
#                              # leader: acknowledge after the commit and
#                              #   replicate asynchronously. A write can be lost
#                              #   if the owner dies before replication.
#                              # quorum: copy to min_replicas - 1 peers first.
#                              # all: copy to every intended replica first.
# read = "local_then_peer"     # local | local_then_peer | leader
# replicas = 3
# min_replicas = 2
