# Example configuration for s3-sidecar.
#
# Cache mode forwards reads to the cache S3 endpoint and can accept writes
# before origin receives them. Cluster mode serves the object API from one or
# more nodes. Use consensus.backend = "single", "raft", or "consul".

mode = "cache"                 # cache | cluster

[server]
bind = "127.0.0.1:9000"

[origin]
endpoint = "http://127.0.0.1:9001"
region = "us-east-1"
access_key_id = "minioadmin"
# Prefer S3_SIDECAR_ORIGIN__SECRET_ACCESS_KEY_FILE or
# --origin-secret-access-key-file in production.
secret_access_key = "minioadmin"
# force_path_style = true

[cache]
endpoint = "http://127.0.0.1:9002"
region = "us-east-1"
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
# force_path_style = true
bucket = "s3-sidecar-cache"
prefix = "cache"
node_id = "node-a"
mode = "read_write"            # off | read | write | read_write
max_bytes = 0                  # Required when mode is not "off". 0 is unlimited.
max_object_bytes = 1073741824
write_policy = "write_back"    # write_back | write_through
on_cache_error = "origin"      # origin | fail
high_watermark = 0.9
low_watermark = 0.8
# staging_ttl = "1h"           # Age at which a blob with no metadata is an orphan.
# orphan_ttl = "24h"           # Age at which a failed journal entry is removed.
# sync_workers = 4
# sync_max_attempts = 5
# sync_retry_base_ms = 200
# sync_debounce_ms = 100
# gc_interval = "60s"
# index_path = "s3-sidecar-cache-index.redb"
# serve_quarantined = false

[backing]
# Cluster mode only.
# bucket = "s3-sidecar-data"
# endpoint = "http://127.0.0.1:9001"
# region = "us-east-1"
# access_key_id = "..."
# secret_access_key = "..."

[consensus]
# Cluster mode only.
backend = "single"             # single | raft | consul

[consensus.raft]
# node_id = "a"
# The single backend uses peers. The raft backend uses nodes.
# peers = ["a"]
# The raft backend requires a shared secret and one bootstrap node.
# bootstrap = false
# Prefer S3_SIDECAR_CONSENSUS__RAFT__SECRET_FILE or
# --consensus-raft-secret-file in production.
# secret = "replace-me"
# rpc_timeout = "5s"
# [[consensus.raft.nodes]]
# id = "a"
# addr = "http://127.0.0.1:9000"
# [[consensus.raft.nodes]]
# id = "b"
# addr = "http://127.0.0.1:9100"

[consensus.consul]
# The consul backend uses Consul KV as the metadata authority.
# node_id = "a"
# address = "http://127.0.0.1:8500"
# advertise_addr = "http://127.0.0.1:9000"
# Prefer S3_SIDECAR_CONSENSUS__CONSUL__TOKEN_FILE or
# --consensus-consul-token-file in production.
# token = ""
# session_ttl = "15s"          # The Consul minimum is 10s.
# Prefer S3_SIDECAR_CONSENSUS__CONSUL__SECRET_FILE or
# --consensus-consul-secret-file in production.
# secret = "replace-me"

[cluster]
# Cluster mode only.
# staging_ttl = "1h"           # Age at which an uncommitted blob is an orphan.
# orphan_ttl = "24h"           # Age at which a tombstone and its blob are removed.
# gc_interval = "60s"
# metadata_path = "./s3-sidecar-meta.redb"
# The blob transport token. Required when a bucket replicas value is greater
# than 1. Prefer S3_SIDECAR_CLUSTER__SECRET_FILE or --cluster-secret-file.
# secret = "replace-me"
# read_repair = true           # Store a peer blob locally while serving it.
# replicate_workers = 4        # Concurrent replication workers.
# reconcile_interval = "5m"    # Replica reconciliation interval.
# [[cluster.nodes]]            # The full node directory. Required for replication.
# id = "a"
# addr = "http://127.0.0.1:9000"
# [[cluster.nodes]]
# id = "b"
# addr = "http://127.0.0.1:9100"
# [[cluster.nodes]]
# id = "c"
# addr = "http://127.0.0.1:9200"

[[clients]]
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
buckets = ["media"]

[[buckets]]
name = "media"
ttl = "1h"
# cache_mode = "read_write"
# cache_write_policy = "write_back"
# write_ack = "leader"         # leader | quorum | all
# read = "local_then_peer"     # local | local_then_peer | leader
# replicas = 3
# min_replicas = 2
