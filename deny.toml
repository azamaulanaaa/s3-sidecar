# cargo-deny policy for s3-sidecar.
# The project uses the dual license MIT OR Apache-2.0.

[graph]
# Build the crate graph with all features enabled.
all-features = true
# An empty target list covers every target.
targets = []

[advisories]
version = 2
# Use the default RustSec advisory database.
db-urls = ["https://github.com/RustSec/advisory-db"]
# Fail the check when a crate version is yanked.
yanked = "deny"

[licenses]
version = 2
# The project licenses plus the permissive licenses in the HTTP and TLS tree.
allow = [
  "MIT",
  "Apache-2.0",
  # ring, untrusted, and rustls use ISC.
  "ISC",
  # webpki-roots uses CDLA-Permissive-2.0 data.
  "CDLA-Permissive-2.0",
  # rustls-webpki uses BSD-3-Clause.
  "BSD-3-Clause",
  # The ICU idna data uses the Unicode license.
  "Unicode-3.0",
]
# Require a high confidence score for license text detection.
confidence-threshold = 0.9

[bans]
# Fail the check when one crate has more than one version.
multiple-versions = "deny"
# Fail the check when a dependency uses a wildcard version.
wildcards = "deny"
# Show both duplicate paths in a graph.
highlight = "all"
# Allow default features for workspace crates.
workspace-default-features = "allow"
# Allow default features for external crates.
external-default-features = "allow"

# The duplicate versions below are transitive and cannot be removed without
# dropping axum, reqwest, or rustls. Each entry states the reason.

[[bans.skip]]
name = "base64"
version = "=0.22.1"
reason = "reqwest 0.12 uses base64 0.22. hyper-util uses base64 0.23."

[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "async-stream and tracing-attributes use syn 2. clap uses syn 3."

[[bans.skip]]
name = "windows-sys"
version = "=0.52.0"
reason = "ring uses windows-sys 0.52. tokio uses windows-sys 0.61."

[[bans.skip]]
name = "cpufeatures"
version = "=0.2.17"
reason = "sha2 uses cpufeatures 0.2. openraft rand uses cpufeatures 0.3."

[[bans.skip]]
name = "getrandom"
version = "=0.2.17"
reason = "ring uses getrandom 0.2. openraft rand uses getrandom 0.4."

[[bans.skip]]
name = "rand"
version = "=0.8.8"
reason = "openraft chrono-tz build code uses rand 0.8. openraft runtime uses rand 0.10."

[[bans.skip]]
name = "rand_core"
version = "=0.6.4"
reason = "rand 0.8 uses rand_core 0.6. rand 0.10 uses rand_core 0.10."

[[bans.skip]]
name = "getrandom"
version = "=0.3.4"
reason = "opentelemetry_sdk rand 0.9 uses getrandom 0.3. openraft rand 0.10 uses getrandom 0.4."

[[bans.skip]]
name = "r-efi"
version = "=5.3.0"
reason = "getrandom 0.3 uses r-efi 5. getrandom 0.4 uses r-efi 6."

[[bans.skip]]
name = "rand"
version = "=0.9.5"
reason = "opentelemetry_sdk uses rand 0.9 for metric IDs. openraft uses rand 0.10."

[[bans.skip]]
name = "rand_core"
version = "=0.9.5"
reason = "rand 0.9 uses rand_core 0.9. rand 0.10 uses rand_core 0.10."

[[bans.skip]]
name = "reqwest"
version = "=0.12.28"
reason = "the sidecar uses reqwest 0.12. opentelemetry-otlp uses reqwest 0.13 for the blocking OTLP HTTP client."

[sources]
# Fail the check for unknown registries.
unknown-registry = "deny"
# Fail the check for unknown git sources.
unknown-git = "deny"
# Allow only the crates.io registry.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow no git sources.
allow-git = []
