# cargo-deny policy for s3-sidecar.
# The project uses the dual license MIT OR Apache-2.0.

[graph]
# Build the crate graph with all features enabled.
all-features = true
# An empty target list covers every target.
targets = []

[advisories]
version = 2
# Use the default RustSec advisory database.
db-urls = ["https://github.com/RustSec/advisory-db"]
# Fail the check when a crate version is yanked.
yanked = "deny"

[licenses]
version = 2
# The project licenses plus the permissive licenses in the HTTP and TLS tree.
allow = [
  "MIT",
  "Apache-2.0",
  # ring, untrusted, and rustls use ISC.
  "ISC",
  # webpki-roots uses CDLA-Permissive-2.0 data.
  "CDLA-Permissive-2.0",
  # rustls-webpki uses BSD-3-Clause.
  "BSD-3-Clause",
  # The ICU idna data uses the Unicode license.
  "Unicode-3.0",
]
# Require a high confidence score for license text detection.
confidence-threshold = 0.9

[bans]
# Fail the check when one crate has more than one version.
multiple-versions = "deny"
# Fail the check when a dependency uses a wildcard version.
wildcards = "deny"
# Show both duplicate paths in a graph.
highlight = "all"
# Allow default features for workspace crates.
workspace-default-features = "allow"
# Allow default features for external crates.
external-default-features = "allow"

# The duplicate versions below are transitive and cannot be removed without
# dropping axum, reqwest, or rustls. Each entry states the reason.

[[bans.skip]]
name = "base64"
version = "=0.22.1"
reason = "reqwest 0.12 uses base64 0.22. hyper-util uses base64 0.23."

[[bans.skip]]
name = "syn"
version = "=2.0.119"
reason = "async-stream and tracing-attributes use syn 2. clap uses syn 3."

[[bans.skip]]
name = "windows-sys"
version = "=0.52.0"
reason = "ring uses windows-sys 0.52. tokio uses windows-sys 0.61."

[sources]
# Fail the check for unknown registries.
unknown-registry = "deny"
# Fail the check for unknown git sources.
unknown-git = "deny"
# Allow only the crates.io registry.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow no git sources.
allow-git = []
