[tools]
cargo-deny = "latest"
cargo-dist = "0.34.0"
rust = "stable"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.fmt]
description = "Format all Rust source files"
run = "cargo fmt --all"

[tasks.lint]
description = "Run Clippy and fail on warnings"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.deny]
description = "Check dependencies with cargo-deny"
run = "cargo deny check"

[tasks.dist-plan]
description = "Print the cargo-dist release plan"
run = "dist plan"

[tasks.set-version]
description = "Set the crate version in Cargo.toml and Cargo.lock"
run = "bash scripts/set-version.sh"

[tasks.check-release-tag]
description = "Check that a release tag matches the crate version"
run = "bash scripts/check-release-tag.sh"

[tasks.ci]
description = "Run the local CI checks that the pre-push hook runs"
run = ".githooks/ci-check.sh push"

[tasks.hooks]
description = "Install the Git hooks for this clone"
run = "git config core.hooksPath .githooks"

[tasks.bench]
description = "Build release and run the benchmark script"
run = "bash scripts/bench.sh"

[tasks.loadgen]
description = "Build the load generator example"
run = "cargo build --release --example loadgen"

[tasks.fuzz]
description = "Install the pinned cargo-fuzz and run both targets for 60 seconds each"
run = "cargo install cargo-fuzz --version 0.13.2 --locked && cd fuzz && cargo +nightly fuzz run sigv4 -- -max_total_time=60 && cargo +nightly fuzz run s3_xml -- -max_total_time=60"
